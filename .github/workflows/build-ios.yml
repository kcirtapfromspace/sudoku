name: Coverage parser replay

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    name: Verify collector against saved CI results
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Test collector and parse every authored source
        run: python3 -m unittest discover -s ios/scripts -p test_coverage.py -v
      - name: Download existing CI test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34997018443 --repo kcirtapfromspace/sudoku --name ios-test-coverage --dir "$RUNNER_TEMP/ios-coverage-replay"
      - name: Verify coverage with exact app and test source hashes
        run: |
          task_run="$RUNNER_TEMP/ios-coverage-replay/run.nSZml6"
          python3 ios/scripts/coverage.py \
            --archive "$task_run/xccov-archive.json" \
            --report "$task_run/xccov-report.json" \
            --manifest "$task_run/source-manifest.json" \
            --output "$RUNNER_TEMP/replayed-coverage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-parser-replay
          path: ${{ runner.temp }}/replayed-coverage.json
