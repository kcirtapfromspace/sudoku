name: Build iOS App

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'crates/sudoku-ffi/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'crates/sudoku-ffi/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      deploy_testflight:
        description: 'Deploy to TestFlight'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCHEME: Sudoku
  PROJECT_PATH: ios/Sudoku/Sudoku.xcodeproj
  BUNDLE_ID: com.ukodus.app

jobs:
  # A fresh simulator test run gates pull requests and TestFlight deployment.
  build:
    name: iOS tests and coverage
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Sudoku/Sudoku.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select current stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test all iOS suites and enforce production coverage
        env:
          SUDOKU_CI_REUSE_SIM: '1'
          SUDOKU_CI_PARALLEL_TESTS: '1'
        run: ./ios/scripts/test-coverage.sh

      - name: Upload test results and coverage, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-coverage
          path: |
            ios/Sudoku/build/coverage/latest-run.txt
            ios/Sudoku/build/coverage/run.*/*.json
            ios/Sudoku/build/coverage/run.*/*.txt
            ios/Sudoku/build/coverage/run.*/*.log
            ios/Sudoku/build/coverage/run.*/tests.xcresult/
          if-no-files-found: warn
          retention-days: 14

  # Generate changelog from recent commits
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_testflight)
    outputs:
      text: ${{ steps.log.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Build changelog from recent commits
        id: log
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            LOG=$(git log "$TAG"..HEAD --pretty=format:"- %s" --no-merges | head -10)
          else
            LOG=$(git log -5 --pretty=format:"- %s" --no-merges)
          fi
          if [ -z "$LOG" ]; then
            LOG="- Bug fixes and improvements"
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

  # Deploy to TestFlight on main branch pushes
  deploy-testflight:
    name: Deploy to TestFlight
    needs: [changelog, build]
    runs-on: macos-15
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_testflight)
    defaults:
      run:
        working-directory: ios/Sudoku

    steps:
      - uses: actions/checkout@v4

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ios/Sudoku/build/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('ios/Sudoku/**/*.swift', 'ios/Sudoku/**/*.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Sudoku/Sudoku.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios

      - name: Build Rust library for iOS
        working-directory: .
        run: |
          echo "Building Rust library for iOS device..."
          cargo build --locked -p sudoku-ffi --release --target aarch64-apple-ios

          echo "Building for native (for uniffi-bindgen)..."
          cargo build --locked -p sudoku-ffi --release

          echo "Copying libraries..."
          mkdir -p ios/Frameworks
          cp target/aarch64-apple-ios/release/libsudoku_ffi.a ios/Frameworks/libsudoku_ffi_device.a

          echo "Generating Swift bindings..."
          mkdir -p ios/Sudoku/Sudoku/Generated
          ./target/release/uniffi-bindgen generate \
            --library ./target/release/libsudoku_ffi.dylib \
            --language swift \
            --out-dir ios/Sudoku/Sudoku/Generated

          echo "Copying headers..."
          cp ios/Sudoku/Sudoku/Generated/SudokuEngineFFI.h ios/Frameworks/
          cp ios/Sudoku/Sudoku/Generated/SudokuEngineFFI.modulemap ios/Frameworks/

          echo "Creating module.modulemap..."
          cat > ios/Frameworks/module.modulemap << 'EOF'
          module SudokuEngineFFI {
              header "SudokuEngineFFI.h"
              export *
          }
          EOF

          echo "Done! Libraries at:"
          ls -la ios/Frameworks/

      - name: Select current stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the tested project definition
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios/Sudoku

      - name: Create App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p fastlane
          echo -n "$API_KEY_BASE64" | base64 --decode > fastlane/AuthKey.p8
          chmod 600 fastlane/AuthKey.p8

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Install provisioning profile
        id: install-profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          PP_CONTENT=$(/usr/bin/security cms -D -i $PP_PATH)
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PP_CONTENT")
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PP_CONTENT")

          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

          echo "Installed provisioning profile: $PP_NAME (UUID: $PP_UUID)"
          echo "PP_UUID=$PP_UUID" >> $GITHUB_OUTPUT
          echo "PP_NAME=$PP_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: ./fastlane/AuthKey.p8
          APPLE_PROVISIONING_PROFILE_NAME: ${{ steps.install-profile.outputs.PP_NAME }}
          APPLE_PROVISIONING_PROFILE_UUID: ${{ steps.install-profile.outputs.PP_UUID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5
          CHANGELOG: ${{ needs.changelog.outputs.text }}
        run: |
          bundle exec fastlane beta_manual \
            changelog:"$CHANGELOG"

      - name: Clean up
        if: always()
        run: |
          rm -f fastlane/AuthKey.p8 || true
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/* || true
